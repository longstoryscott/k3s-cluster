apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: selkies-desktop-official
  namespace: steam
  labels:
    app: selkies-desktop-official
spec:
  serviceName: selkies-desktop-official
  replicas: 1
  selector:
    matchLabels:
      app: selkies-desktop-official
  template:
    metadata:
      labels:
        app: selkies-desktop-official
    spec:
      hostname: selkies-desktop-official
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: lsnode-3
      containers:
        - name: selkies-desktop
          image: 192.168.0.71:31500/steam-desktop:latest
          securityContext:
            privileged: true
          # lifecycle:
          #   postStart:
          #     exec:
          #       command:
          #         - /bin/bash
          #         - -c
          #         - |
          #           # Wait for supervisord to start
          #           sleep 5
          #           # Kill and restart selkies-gstreamer with RTX 3090
          #           supervisorctl stop selkies-gstreamer || true
          #           export GPU_SELECT=GPU-6a792ee8-fbcb-869f-dbe0-05431e3d3355
          #           supervisorctl start selkies-gstreamer || true
          env:
            # Display settings
            - name: TZ
              value: "CDT"
            - name: DISPLAY_SIZEW
              value: "1920"
            - name: DISPLAY_SIZEH
              value: "1080"
            - name: DISPLAY_REFRESH
              value: "60"
            - name: DISPLAY_DPI
              value: "96"
            - name: DISPLAY_CDEPTH
              value: "24"
            - name: VIDEO_PORT
              value: "DFP"

            # Authentication
            - name: PASSWD
              value: "ubuntu"
            - name: SELKIES_ENABLE_BASIC_AUTH
              value: "false"

            # GPU settings - Force RTX 3090 (index 0) explicitly for stability
            - name: NVIDIA_VISIBLE_DEVICES
              value: "GPU-6a792ee8-fbcb-869f-dbe0-05431e3d3355"
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "all"
            - name: VGL_DISPLAY
              value: "egl"

            # Selkies WebRTC configuration
            - name: SELKIES_ENCODER
              value: "nvh264enc"  # Hardware encoding with EGL
            - name: SELKIES_ENABLE_RESIZE
              value: "false"
            - name: SELKIES_VIDEO_BITRATE
              value: "8000"
            - name: SELKIES_FRAMERATE
              value: "60"
            - name: SELKIES_AUDIO_BITRATE
              value: "128000"
            - name: SELKIES_ENABLE_HTTPS
              value: "false"
            - name: NGINX_PORT
              value: "58080"

          stdin: true
          tty: true
          ports:
            - name: http
              containerPort: 58080
              protocol: TCP

          resources:
            requests:
              memory: "2Gi"
              cpu: "1"
              nvidia.com/gpu: "1"
            limits:
              memory: "32Gi"
              cpu: "24"
              nvidia.com/gpu: "1"

          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: steam-home
              mountPath: /home/ubuntu
            - name: steam-cache
              mountPath: /cache
            - name: unreal-engine
              mountPath: /opt/UnrealEngine

      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi

  volumeClaimTemplates:
    - metadata:
        name: steam-home
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
    - metadata:
        name: steam-cache
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
    - metadata:
        name: unreal-engine
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Gi
