apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-local
  namespace: nginx-local
data:
  nginx.conf: |
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';

        access_log /var/log/nginx/access.log main;

        sendfile        on;
        tcp_nopush      on;
        tcp_nodelay     on;
        keepalive_timeout 65;
        types_hash_max_size 2048;

        # Upstream definitions — resolved via kube-dns
        upstream nextcloud        { server nextcloud.nextcloud.svc.cluster.local:8080; }
        upstream dex              { server dex.auth.svc.cluster.local:5556; }
        upstream usrmgr           { server usrmgr.auth.svc.cluster.local:3333; }
        upstream registry_up      { server registry.registry.svc.cluster.local:5000; }
        upstream registry_ui_up   { server registry-ui.registry.svc.cluster.local:80; }
        upstream fnf              { server fnf.fnf.svc.cluster.local:80; }
        upstream pgadmin          { server pgadmin.psql.svc.cluster.local:8084; }
        upstream searxng          { server searxng.searxng.svc.cluster.local:8080; }
        upstream steam            { server selkies-desktop-official.steam.svc.cluster.local:58080; }
        upstream home_assistant   { server home-assistant.home-assistant.svc.cluster.local:80; }
        upstream metrics          { server metrics-server.session-guardian.svc.cluster.local:80; }
        upstream llmll            { server llmll-server.llmll.svc.cluster.local:8000; }
        upstream openclaw         { server openclaw.openclaw.svc.cluster.local:8000; }
        upstream ollama           { server ollama.llmll.svc.cluster.local:11434; }

        # Common proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;

        # WebSocket upgrade map
        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      close;
        }

        # ── nextcloud.local ──
        server {
            listen 80;
            server_name nextcloud.local;
            location / { proxy_pass http://nextcloud; }
        }

        # ── auth.local (Dex OIDC) ──
        server {
            listen 80;
            server_name auth.local;
            location / {
                proxy_pass http://dex;
                proxy_read_timeout 300s;
                proxy_send_timeout 300s;
                add_header Access-Control-Allow-Origin "*" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
                if ($request_method = OPTIONS) { return 204; }
            }
        }

        # ── usrmgr.local ──
        server {
            listen 80;
            server_name usrmgr.local;
            location / {
                proxy_pass http://usrmgr;
                proxy_read_timeout 300s;
                proxy_send_timeout 300s;
                add_header Access-Control-Allow-Origin "*" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
                if ($request_method = OPTIONS) { return 204; }
            }
        }

        # ── registry.local ──
        server {
            listen 80;
            server_name registry.local;
            location / {
                proxy_pass http://registry_up;
                proxy_set_header Host $http_host;
            }
        }

        # ── registry-ui.local ──
        server {
            listen 80;
            server_name registry-ui.local;
            location / { proxy_pass http://registry_ui_up; }
        }

        # ── fnf.local ──
        server {
            listen 80;
            server_name fnf.local;
            location / { proxy_pass http://fnf; }
        }

        # ── pgadmin.local ──
        server {
            listen 80;
            server_name pgadmin.local;
            location / { proxy_pass http://pgadmin; }
        }

        # ── search.local (SearXNG) ──
        server {
            listen 80;
            server_name search.local;
            location / { proxy_pass http://searxng; }
        }

        # ── steam.local (WebSocket / noVNC) ──
        server {
            listen 80;
            server_name steam.local;
            location / {
                proxy_pass http://steam;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_read_timeout 86400s;
                proxy_send_timeout 86400s;
            }
        }

        # ── home.local (Home Assistant) ──
        server {
            listen 80;
            server_name home.local;
            location / {
                proxy_pass http://home_assistant;
                proxy_set_header X-Forwarded-Host $host;
                proxy_set_header X-Forwarded-Port $server_port;
            }
        }

        # ── metrics.local ──
        server {
            listen 80;
            server_name metrics.local;
            location / { proxy_pass http://metrics; }
        }

        # ── llmll.local ──
        server {
            listen 80;
            server_name llmll.local;
            location / { proxy_pass http://llmll; }
        }

        # ── claw.local (OpenClaw) ──
        server {
            listen 80;
            server_name claw.local;
            location / { proxy_pass http://openclaw; }
        }

        # ── ollama.local (long timeouts for generation) ──
        server {
            listen 80;
            server_name ollama.local;
            location / {
                proxy_pass http://ollama;
                proxy_read_timeout 1800s;
                proxy_connect_timeout 1800s;
                proxy_send_timeout 1800s;
                send_timeout 1800s;
                proxy_set_header Accept-Encoding "";
            }
        }

        # ── Default — service directory ──
        server {
            listen 80 default_server;
            server_name _;
            location / {
                return 200 '<!DOCTYPE html><html><head><title>Local Services</title>'
                           '<style>body{font-family:system-ui,sans-serif;max-width:600px;'
                           'margin:40px auto;background:#111;color:#eee} a{color:#5af;'
                           'text-decoration:none;display:block;padding:8px 0;border-bottom:'
                           '1px solid #333}</style></head><body><h1>Local Services</h1>'
                           '<a href="http://nextcloud.local">Nextcloud</a>'
                           '<a href="http://home.local">Home Assistant</a>'
                           '<a href="http://auth.local">Auth (Dex)</a>'
                           '<a href="http://usrmgr.local">User Manager</a>'
                           '<a href="http://search.local">SearXNG Search</a>'
                           '<a href="http://steam.local">Steam Desktop</a>'
                           '<a href="http://metrics.local">Session Guardian Metrics</a>'
                           '<a href="http://pgadmin.local">pgAdmin</a>'
                           '<a href="http://registry.local">Container Registry</a>'
                           '<a href="http://registry-ui.local">Registry UI</a>'
                           '<a href="http://fnf.local">FNF</a>'
                           '<a href="http://llmll.local">LLMll Server</a>'
                           '<a href="http://claw.local">OpenClaw</a>'
                           '<a href="http://ollama.local">Ollama API</a>'
                           '</body></html>';
                add_header Content-Type text/html;
            }
        }
    }
