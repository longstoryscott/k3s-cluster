{{ define "login" }}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <title>{{ issuer }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #f5f5f5;
      font-family: 'Roboto', Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .login-container {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.08);
      padding: 2.5rem 2rem;
      max-width: 400px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .login-title {
      text-align: center;
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .login-desc {
      text-align: center;
      color: #666;
      margin-bottom: 1rem;
    }

    .login-btn {
      width: 100%;
      padding: 0.75rem;
      background: #1976d2;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 1.1rem;
      font-weight: 500;
      cursor: pointer;
      margin-top: 1rem;
      transition: background 0.2s;
    }

    .login-btn:hover {
      background: #1565c0;
    }

    .login-error {
      color: #d32f2f;
      text-align: center;
      margin-bottom: 1rem;
    }
  </style>
</head>

<body>
  <div class="login-container">
    <div class="login-title">Welcome to {{ issuer }}</div>
    <div class="login-desc">Sign in to access your applications</div>

    {{ range $c := .Connectors }}
    <div>
      <a href="{{ $c.URL }}" target="_self" style="text-decoration: none;">
        <button class="login-btn">
          Sign in with {{ $c.Name }}
        </button>
      </a>
    </div>
    {{ end }}

    {{ if .Error }}
    <div class="login-error">{{ .Error }}</div>
    {{ end }}
  </div>
</body>

</html>
{{ end }}
