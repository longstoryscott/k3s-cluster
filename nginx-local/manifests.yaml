apiVersion: v1
kind: Namespace
metadata:
  name: nginx-local
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nginx-local
  namespace: nginx-local
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-local
  namespace: nginx-local
  labels:
    app: nginx-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-local
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: nginx-local
    spec:
      serviceAccountName: nginx-local
      automountServiceAccountToken: false
      # Pin to lsnode-0 so the NodePort IP is stable
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - lsnode-0
      containers:
        - name: nginx
          image: 192.168.0.71:31500/nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: config
          configMap:
            name: nginx-local
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-local
  namespace: nginx-local
  labels:
    app: nginx-local
spec:
  type: NodePort
  selector:
    app: nginx-local
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
