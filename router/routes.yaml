apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lsm-gateway
  namespace: nginx-gateway
  labels:
    app: lsm-gateway
spec:
  gatewayClassName: nginx
  listeners:
    - name: nextcloud
      port: 3000
      protocol: HTTP
    # - name: ollama
    #   port: 11434
    #   protocol: HTTP
    # - name: llmmllab  # Removed - conflicts with ollama LoadBalancer port 8000
    #   port: 8000
    #   protocol: HTTP
    - name: dex
      port: 9091
      protocol: HTTP
    - name: registry
      port: 5000
      protocol: HTTP
    - name: grafana
      port: 3001
      protocol: HTTP
    - name: prometheus
      port: 9090
      protocol: HTTP
    - name: alertmanager
      port: 9093
      protocol: HTTP
    - name: fnf
      protocol: HTTP
      port: 8082
    # - name: maistro
    #   protocol: HTTP
    #   port: 8083
    - name: usrmgr
      protocol: HTTP
      port: 3333
    - name: pgadmin
      port: 8084
      protocol: HTTP
    # - name: inference
    #   port: 50051
    #   protocol: HTTP
    - name: registry-ui
      protocol: HTTP
      port: 8085
    - name: searxng
      protocol: HTTP
      port: 8086
    - name: steam
      protocol: HTTP
      port: 4567
---
apiVersion: gateway.nginx.org/v1alpha1
kind: ClientSettingsPolicy
metadata:
  name: gateway-policy
  namespace: nginx-gateway
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: lsm-gateway
  body:
    maxSize: "0"
--- # Nextcloud
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nc-route
  namespace: nginx-gateway
spec:
  parentRefs:
    - name: lsm-gateway
      sectionName: nextcloud
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: nextcloud
          namespace: nextcloud
          port: 8080
