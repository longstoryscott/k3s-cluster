worker_processes auto;
error_log /var/log/nginx-local/error.log warn;
pid /run/nginx-local/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx-local/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Upstreams — all go to the in-cluster NGINX Gateway on localhost
    upstream nextcloud      { server 127.0.0.1:3000; }
    upstream dex            { server 127.0.0.1:9091; }
    upstream usrmgr         { server 127.0.0.1:3333; }
    upstream registry_up    { server 127.0.0.1:5000; }
    upstream registry_ui_up { server 127.0.0.1:8085; }
    upstream fnf            { server 127.0.0.1:8082; }
    upstream pgadmin        { server 127.0.0.1:8084; }
    upstream searxng        { server 127.0.0.1:8086; }
    upstream steam          { server 127.0.0.1:4567; }
    upstream home_assistant { server 127.0.0.1:8123; }
    upstream llmll          { server 127.0.0.1:8001; }

    # Common proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_buffering off;

    # WebSocket upgrade map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── nc.lan (Nextcloud) ──
    server {
        listen 80;
        server_name nc.lan nc;
        location / { proxy_pass http://nextcloud; }
    }

    # ── ha.lan (Home Assistant) ──
    server {
        listen 80;
        server_name ha.lan ha;
        location / {
            proxy_pass http://home_assistant;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }
    }

    # ── auth.lan (Dex OIDC) ──
    server {
        listen 80;
        server_name auth.lan auth;
        location / {
            proxy_pass http://dex;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            if ($request_method = OPTIONS) { return 204; }
        }
    }

    # ── usrmgr.lan ──
    server {
        listen 80;
        server_name usrmgr.lan usrmgr;
        location / {
            proxy_pass http://usrmgr;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            if ($request_method = OPTIONS) { return 204; }
        }
    }

    # ── registry.lan ──
    server {
        listen 80;
        server_name registry.lan registry;
        location / {
            proxy_pass http://registry_up;
            proxy_set_header Host $http_host;
        }
    }

    # ── regui.lan (Registry UI) ──
    server {
        listen 80;
        server_name regui.lan regui;
        location / { proxy_pass http://registry_ui_up; }
    }

    # ── fnf.lan ──
    server {
        listen 80;
        server_name fnf.lan fnf;
        location / { proxy_pass http://fnf; }
    }

    # ── pgadmin.lan ──
    server {
        listen 80;
        server_name pgadmin.lan pgadmin;
        location / { proxy_pass http://pgadmin; }
    }

    # ── search.lan (SearXNG) ──
    server {
        listen 80;
        server_name search.lan search;
        location / { proxy_pass http://searxng; }
    }

    # ── steam.lan (WebSocket / noVNC) ──
    server {
        listen 80;
        server_name steam.lan steam;
        location / {
            proxy_pass http://steam;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }

    # ── llmll.lan ──
    server {
        listen 80;
        server_name llmll.lan llmll;
        location / { proxy_pass http://llmll; }
    }

    # ── Default — service directory ──
    server {
        listen 80 default_server;
        server_name _ lsnode-0 lsnode-0.lan;
        location / {
            default_type text/html;
            return 200 '<!DOCTYPE html><html><head><title>Local Services</title><style>body{font-family:system-ui,sans-serif;max-width:600px;margin:40px auto;background:#111;color:#eee} a{color:#5af;text-decoration:none;display:block;padding:8px 0;border-bottom:1px solid #333}</style></head><body><h1>Local Services</h1><a href="http://nc.lan">Nextcloud</a><a href="http://ha.lan">Home Assistant</a><a href="http://auth.lan">Auth (Dex)</a><a href="http://usrmgr.lan">User Manager</a><a href="http://search.lan">SearXNG Search</a><a href="http://steam.lan">Steam Desktop</a><a href="http://pgadmin.lan">pgAdmin</a><a href="http://registry.lan">Container Registry</a><a href="http://regui.lan">Registry UI</a><a href="http://fnf.lan">FNF</a><a href="http://llmll.lan">LLMll Server</a></body></html>';
        }
    }
}
