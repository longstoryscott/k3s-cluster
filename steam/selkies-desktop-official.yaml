apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: selkies-desktop-official
  namespace: steam
  labels:
    app: selkies-desktop-official
spec:
  serviceName: selkies-desktop-official
  replicas: 1
  selector:
    matchLabels:
      app: selkies-desktop-official
  template:
    metadata:
      labels:
        app: selkies-desktop-official
    spec:
      hostname: selkies-desktop-official
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      runtimeClassName: nvidia
      containers:
        - name: selkies-desktop
          image: 192.168.0.71:31500/steam-desktop:latest
          securityContext:
            privileged: true
          # lifecycle:
          #   postStart:
          #     exec:
          #       command:
          #         - /bin/bash
          #         - -c
          #         - |
          #           # Wait for supervisord to start
          #           sleep 5
          #           # Kill and restart selkies-gstreamer with RTX 3090
          #           supervisorctl stop selkies-gstreamer || true
          #           export GPU_SELECT=GPU-6a792ee8-fbcb-869f-dbe0-05431e3d3355
          #           supervisorctl start selkies-gstreamer || true
          env:
            # Display settings
            - name: TZ
              value: "CDT"
            - name: DISPLAY_SIZEW
              value: "1920"
            - name: DISPLAY_SIZEH
              value: "1080"
            - name: DISPLAY_REFRESH
              value: "60"
            - name: DISPLAY_DPI
              value: "96"
            - name: DISPLAY_CDEPTH
              value: "24"
            - name: VIDEO_PORT
              value: "DFP"

            # Authentication
            - name: PASSWD
              value: "ubuntu"
            - name: SELKIES_ENABLE_BASIC_AUTH
              value: "false"
            - name: KASMVNC_ENABLE
              value: "false" # EGL uses Xvfb/Xdummy, not KasmVNC

            # GPU settings - Force RTX 3090 (index 0) explicitly for stability
            - name: NVIDIA_VISIBLE_DEVICES
              value: "GPU-6a792ee8-fbcb-869f-dbe0-05431e3d3355"
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "all"
            # - name: __NV_PRIME_RENDER_OFFLOAD
            #   value: "1"
            # - name: __GLX_VENDOR_LIBRARY_NAME
            #   value: "nvidia"
            # - name: __GL_SYNC_TO_VBLANK
            #   value: "0"
            - name: __GL_YIELD
              value: "USLEEP"
            # - name: VK_ICD_FILENAMES
            #   value: "/etc/vulkan/icd.d/nvidia_icd.json"
            # - name: MESA_VK_DEVICE_SELECT
            #   value: "10de:2204"

            # Vulkan configuration for Unreal Engine
            # - name: VK_ICD_FILENAMES
            #   value: "/etc/vulkan/icd.d/nvidia_icd.json"
            # - name: VK_DRIVER_FILES
            #   value: "/etc/vulkan/icd.d/nvidia_icd.json"
            - name: __GLX_VENDOR_LIBRARY_NAME
              value: "nvidia"

            # Selkies WebRTC configuration
            - name: SELKIES_ENCODER
              value: "x264enc" # Using software encoding - hw encoder fails with resource limits
            - name: SELKIES_ENABLE_RESIZE
              value: "false"
            - name: SELKIES_VIDEO_BITRATE
              value: "8000"
            - name: SELKIES_FRAMERATE
              value: "60"
            - name: SELKIES_AUDIO_BITRATE
              value: "128000"
            - name: SELKIES_ENABLE_HTTPS
              value: "false"

            # Host networking port override
            - name: NGINX_PORT
              value: "58080"
            - name: SELKIES_PORT
              value: "58081"
            - name: SELKIES_METRICS_HTTP_PORT
              value: "58082"

          stdin: true
          tty: true
          ports:
            - name: http
              containerPort: 58080
              protocol: TCP

          resources:
            requests:
              memory: "2Gi"
              cpu: "1"
              nvidia.com/gpu: "1"
            limits:
              memory: "32Gi"
              cpu: "24"
              nvidia.com/gpu: "1"

          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: steam-home
              mountPath: /home/ubuntu
            - name: steam-cache
              mountPath: /cache
            - name: unreal-engine
              mountPath: /opt/UnrealEngine
 
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi

  volumeClaimTemplates:
    - metadata:
        name: steam-home
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
    - metadata:
        name: steam-cache
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
    - metadata:
        name: unreal-engine
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Gi
