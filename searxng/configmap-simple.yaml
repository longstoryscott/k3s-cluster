apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-config
  namespace: searxng
data:
  settings.yml: |
    use_default_settings: true

    general:
      instance_name: "SearXNG K3s"
      
    server:
      secret_key: "${SEARXNG_SECRET_KEY}"
      limiter: false
      
    search:
      formats: [html, json]
