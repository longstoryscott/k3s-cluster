apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  namespace: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dex
  template:
    metadata:
      labels:
        app: dex
    spec:
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:v2.42.1
          volumeMounts:
            - name: config
              mountPath: /etc/dex
            # Mount the entire templates directory structure at once
            # Important: This should completely replace the built-in templates
            - name: dex-templates-dir
              mountPath: /etc/dex/custom-templates
          ports:
            - containerPort: 5556
          args:
            - dex
            - serve
            - /etc/dex/config.yaml
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          env:
            - name: DEXFRONTEND_DIR
              value: /etc/dex/custom-templates/
      initContainers:
        - name: setup-templates
          image: busybox
          command:
            - sh
            - -c
            - |
              echo "Setting up template directory structure..."
              mkdir -p /templates/templates /templates/static /templates/themes

              # Process template files
              for file in $(ls -1 /cm-data | grep templates_); do
                filename=$(echo $file | sed 's/templates_//')
                echo "Processing template file: $filename"
                cp /cm-data/$file /templates/templates/$filename
              done

              # Process static files
              for file in $(ls -1 /cm-data | grep static_); do
                filename=$(echo $file | sed 's/static_//')
                echo "Processing static file: $filename"
                cp /cm-data/$file /templates/static/$filename
              done

              # Process theme files
              for file in $(ls -1 /cm-data | grep themes_); do
                filename=$(echo $file | sed 's/themes_//')
                echo "Processing theme file: $filename"
                cp /cm-data/$file /templates/themes/$filename
              done

              # Process root files
              if [ -f "/cm-data/robots.txt" ]; then
                echo "Copying robots.txt"
                cp /cm-data/robots.txt /templates/robots.txt
              fi

              if [ -f "/cm-data/web.go" ]; then
                echo "Copying web.go"
                cp /cm-data/web.go /templates/web.go
              fi

              echo "Template setup complete"
              ls -la /templates
              ls -la /templates/templates
          volumeMounts:
            - name: dex-templates
              mountPath: /cm-data
            - name: dex-templates-dir
              mountPath: /templates
      volumes:
        - name: config
          projected:
            sources:
              - configMap:
                  name: config
        - name: dex-templates-dir
          emptyDir: {}
        - name: dex-templates
          configMap:
            name: dex-templates
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openldap
  namespace: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openldap
  template:
    metadata:
      labels:
        app: openldap
    spec:
      initContainers:
        - name: copy-ldif
          image: busybox
          command: ["sh", "-c", "cp /ldif-src/* /ldif-seed/"]
          volumeMounts:
            - name: openldap-seed-ldif
              mountPath: /ldif-src
            - name: openldap-seed-ldif-writable
              mountPath: /ldif-seed
      containers:
        - name: openldap
          image: osixia/openldap:1.5.0
          ports:
            - containerPort: 389
          env:
            - name: LDAP_ORGANISATION
              value: "Long Story Media"
            - name: LDAP_DOMAIN
              value: "longstorymedia.com"
            - name: LDAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openldap-admin-secret
                  key: LDAP_ADMIN_PASSWORD
            - name: LDAP_SEED_LDIF_PATH
              value: "/ldif-seed"
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          volumeMounts:
            - name: ldap-data
              mountPath: /var/lib/ldap
            - name: ldap-config
              mountPath: /etc/ldap/slapd.d
            - name: openldap-seed-ldif-writable
              mountPath: /ldif-seed
      volumes:
        - name: ldap-data
          emptyDir: {}
        - name: ldap-config
          emptyDir: {}
        - name: openldap-seed-ldif
          configMap:
            name: openldap-seed-ldif
        - name: openldap-seed-ldif-writable
          emptyDir: {}
