apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lsm-gateway
  namespace: nginx-gateway
  labels:
    app: lsm-gateway
spec:
  gatewayClassName: nginx
  listeners:
    - name: nextcloud
      port: 3000
      protocol: HTTP
    - name: ollama
      port: 11434
      protocol: HTTP
    - name: dex
      port: 9091
      protocol: HTTP
    - name: registry
      port: 5000
      protocol: HTTP
    - name: grafana
      port: 3001
      protocol: HTTP
    - name: prometheus
      port: 9090
      protocol: HTTP
    - name: alertmanager
      port: 9093
      protocol: HTTP
    - name: fnf
      protocol: HTTP
      port: 8082
      # hostname: press.longstorymedia.com
      # allowedRoutes:
      #   namespaces:
      #     from: Same
---
apiVersion: gateway.nginx.org/v1alpha1
kind: ClientSettingsPolicy
metadata:
  name: gateway-policy
  namespace: nginx-gateway
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: lsm-gateway
  body:
    maxSize: "0"
--- # Nextcloud
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nc-route
  namespace: nginx-gateway
spec:
  parentRefs:
    - name: lsm-gateway
      sectionName: nextcloud
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # filters:
      #   - type: ExtensionRef
      #     extensionRef:
      #       name: nextcloud-max-body-size
      #       kind: SnippetsFilter
      #       group: gateway.nginx.org
      backendRefs:
        - name: nextcloud
          namespace: nextcloud
          port: 8080
# ---
# apiVersion: gateway.nginx.org/v1alpha1
# kind: SnippetsFilter
# metadata:
#   name: nc-max-body-size
#   namespace: nginx-gateway
# spec:
#   snippets:
#     - context: http.server.location
#       value: |
#         client_max_body_size 0;
--- # Ollama
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ollama-route
  namespace: nginx-gateway
spec:
  parentRefs:
    - name: lsm-gateway
      sectionName: ollama
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ollama
          namespace: ollama
          port: 11434
--- # dex
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dex-route
  namespace: nginx-gateway
spec:
  parentRefs:
    - name: lsm-gateway
      namespace: nginx-gateway
      sectionName: dex
  hostnames:
    - "auth.longstorymedia.com"
    - "localhost"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
          method: OPTIONS
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: dex
          namespace: auth
          port: 5556
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: Access-Control-Allow-Origin
                value: "*"
              - name: Access-Control-Allow-Credentials
                value: "true"
              - name: Access-Control-Allow-Methods
                value: "GET, POST, OPTIONS"
              - name: Access-Control-Allow-Headers
                value: "Content-Type, Authorization"
--- # Grafana
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-route
  namespace: nginx-gateway
spec:
  parentRefs:
    - name: lsm-gateway
      sectionName: grafana
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: grafana
          namespace: monitoring
          port: 80

--- # Prometheus
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus-route
  namespace: nginx-gateway
spec:
  parentRefs:
    - name: lsm-gateway
      sectionName: prometheus
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: prometheus-kube-prometheus-prometheus
          namespace: monitoring
          port: 9090
--- # Alertmanager
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager-route
  namespace: nginx-gateway
spec:
  parentRefs:
    - name: lsm-gateway
      sectionName: alertmanager
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: prometheus-kube-prometheus-alertmanager
          namespace: monitoring
          port: 9093
--- # fnf
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: fnf-route
  namespace: nginx-gateway
spec:
  parentRefs:
    - name: lsm-gateway
      sectionName: fnf
  # hostnames:
  #   - press.longstorymedia.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/" # match all paths for this host
      backendRefs:
        - name: fnf
          port: 80
          namespace: fnf
          weight: 1
