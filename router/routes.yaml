--- # dex timeout policy
apiVersion: gateway.nginx.org/v1alpha1
kind: ClientSettingsPolicy
metadata:
  name: auth-timeout-policy
  namespace: nginx-gateway
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: dex-route
  body:
    timeout: "300s"
  keepAlive:
    time: 300s
    timeout:
      server: 300s
      header: 300s
--- # dex
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dex-route
  namespace: nginx-gateway
spec:
  parentRefs:
    - name: lsm-gateway
      namespace: nginx-gateway
      sectionName: dex
  hostnames:
    - "auth.longstorymedia.com"
    - "localhost"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
          method: OPTIONS
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: dex
          namespace: auth
          port: 5556
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: Access-Control-Allow-Origin
                value: "*"
              - name: Access-Control-Allow-Credentials
                value: "true"
              - name: Access-Control-Allow-Methods
                value: "GET, POST, OPTIONS"
              - name: Access-Control-Allow-Headers
                value: "Content-Type, Authorization"
--- # usrmgr timeout policy
apiVersion: gateway.nginx.org/v1alpha1
kind: ClientSettingsPolicy
metadata:
  name: usrmgr-timeout-policy
  namespace: nginx-gateway
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: usrmgr-route
  body:
    timeout: "300s"
  keepAlive:
    time: 300s
    timeout:
      server: 300s
      header: 300s
--- # usrmgr
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: usrmgr-route
  namespace: nginx-gateway
spec:
  parentRefs:
    - name: lsm-gateway
      sectionName: usrmgr
  hostnames:
    - "auth.longstorymedia.com"
    - "localhost"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: usrmgr
          namespace: auth
          port: 3333
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: Access-Control-Allow-Origin
                value: "*"
              - name: Access-Control-Allow-Credentials
                value: "true"
              - name: Access-Control-Allow-Methods
                value: "GET, POST, PUT, DELETE, OPTIONS"
              - name: Access-Control-Allow-Headers
                value: "Content-Type, Authorization"
--- # Grafana
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-route
  namespace: nginx-gateway
spec:
  parentRefs:
    - name: lsm-gateway
      sectionName: grafana
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: grafana
          namespace: monitoring
          port: 80

--- # Prometheus
apiVersion: gateway.networking.k8s.io/v1
