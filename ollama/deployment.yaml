apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ollama
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/instance: ollama
    app.kubernetes.io/component: app
spec:
  selector:
    matchLabels:
      name: ollama
  template:
    metadata:
      labels:
        name: ollama
        app.kubernetes.io/name: ollama
        app.kubernetes.io/instance: ollama
        app.kubernetes.io/component: app
    spec:
      runtimeClassName: nvidia
      volumes:
        - name: ollama-models-volume
          persistentVolumeClaim:
            claimName: ollama-models
        - name: init-script
          configMap:
            name: ollama-init-script
            defaultMode: 0755
      containers:
        - name: ollama
          image: ollama/ollama:latest
          command: ["/bin/sh", "/scripts/init.sh"]
          lifecycle:
            postStart:
              exec:
                command:
                  - "/bin/bash"
                  - "-c"
                  - |
                    # Start Ollama in the background
                    ollama serve &
                    # Give Ollama some time to start up
                    sleep 10
                    echo "Gettings models..."
                    ollama pull llama3.2
                    ollama pull mistral
                    ollama pull opencoder:latest
                    ollama pull granite-embedding
                    ollama pull qwen3:0.6b
                    ollama pull gemma3:12b
                    ollama pull phi4-reasoning:plus
                    ollama pull cogito:8b
                    # List available models
                    echo "Available models:"
                    ollama list
                    # Wait for the ollama process
                    wait
          ports:
            - name: http
              containerPort: 11434
              protocol: TCP
          resources:
            requests:
              memory: "24Gi"
              cpu: "8"
              nvidia.com/gpu: "2"
            limits:
              memory: "30Gi"
              cpu: "10"
              nvidia.com/gpu: "2"
          volumeMounts:
            - name: ollama-models-volume
              mountPath: /root/.ollama
            - name: init-script
              mountPath: /scripts
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0"
  strategy:
    type: Recreate
