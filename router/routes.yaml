  namespace: nginx-gateway
spec:
  parentRefs:
    - name: lsm-gateway
      sectionName: registry
  hostnames:
    - "registry.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: registry
          namespace: registry
          port: 5000
          kind: Service
