apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: selkies-desktop-official
  namespace: steam
  labels:
    app: selkies-desktop-official
spec:
  serviceName: selkies-desktop-official
  replicas: 1
  selector:
    matchLabels:
      app: selkies-desktop-official
  template:
    metadata:
      labels:
        app: selkies-desktop-official
    spec:
      hostname: selkies-desktop-official
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      runtimeClassName: nvidia
      containers:
        - name: selkies-desktop
          image: ghcr.io/selkies-project/nvidia-glx-desktop:latest
          securityContext:
            privileged: true
          env:
            # Display settings
            - name: TZ
              value: "UTC"
            - name: DISPLAY_SIZEW
              value: "1920"
            - name: DISPLAY_SIZEH
              value: "1080"
            - name: DISPLAY_REFRESH
              value: "60"
            - name: DISPLAY_DPI
              value: "96"
            - name: DISPLAY_CDEPTH
              value: "24"
            - name: VIDEO_PORT
              value: "DFP"

            # Authentication
            - name: PASSWD
              value: "ubuntu"
            - name: SELKIES_ENABLE_BASIC_AUTH
              value: "false"

            # GPU settings
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "all"

            # Selkies WebRTC configuration
            - name: SELKIES_ENCODER
              value: "nvh264enc"
            - name: SELKIES_ENABLE_RESIZE
              value: "false"
            - name: SELKIES_VIDEO_BITRATE
              value: "8000"
            - name: SELKIES_FRAMERATE
              value: "60"
            - name: SELKIES_AUDIO_BITRATE
              value: "128000"
            - name: SELKIES_ENABLE_HTTPS
              value: "false"

            # Host networking port override
            - name: NGINX_PORT
              value: "58080"

          stdin: true
          tty: true
          ports:
            - name: http
              containerPort: 58080
              protocol: TCP

          resources:
            requests:
              memory: "2Gi"
              cpu: "1"
            limits:
              memory: "8Gi"
              cpu: "4"

          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: steam-home
              mountPath: /home/ubuntu
            - name: steam-cache
              mountPath: /cache

      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi

  volumeClaimTemplates:
    - metadata:
        name: steam-home
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
    - metadata:
        name: steam-cache
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
