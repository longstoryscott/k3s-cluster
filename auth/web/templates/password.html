{{ define "password" }}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <title>{{ issuer }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #f5f5f5;
      font-family: 'Roboto', Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .login-container {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.08);
      padding: 2.5rem 2rem;
      max-width: 400px;
      width: 100%;
    }

    .login-title {
      text-align: center;
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }

    .login-subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 2rem;
    }

    .login-form-group {
      margin-bottom: 1.5rem;
    }

    .login-label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
    }

    .login-input {
      width: 100%;
      padding: 0.75rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }

    .login-btn {
      width: 100%;
      padding: 0.75rem;
      background: #1976d2;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 1.1rem;
      font-weight: 500;
      cursor: pointer;
      margin-top: 1rem;
    }

    .login-btn:hover {
      background: #1565c0;
    }

    .login-error {
      color: #d32f2f;
      text-align: center;
      margin-bottom: 1rem;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 1rem;
      color: #1976d2;
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="login-container">
    <div class="login-title">Log in to {{ issuer }}</div>
    <div class="login-subtitle">Sign in to {{ .ConnectorName }}</div>

    {{ if .Invalid }}
    <div class="login-error">Invalid username or password</div>
    {{ end }}

    <form method="post" action="{{ .PostURL }}">
      <div class="login-form-group">
        <label for="userid" class="login-label">Username</label>
        <input tabindex="1" required id="login" name="login" type="text" class="login-input" placeholder="Username" {{
          if .Username }}value="{{ .Username }}" {{ else }}autofocus{{ end }}>
      </div>

      <div class="login-form-group">
        <label for="password" class="login-label">Password</label>
        <input tabindex="2" required id="password" name="password" type="password" class="login-input"
          placeholder="Password" {{ if .Username }}autofocus{{ end }}>
      </div>

      <button tabindex="3" id="submit-login" type="submit" class="login-btn">
        Log in
      </button>
    </form>

    {{ if .BackLink }}
    <a href="{{ .BackLink }}" class="back-link">Back to login options</a>
    {{ end }}
  </div>
</body>

</html>
{{ end }}
