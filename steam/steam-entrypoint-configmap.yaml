apiVersion: v1
kind: ConfigMap
metadata:
  name: steam-entrypoint
  namespace: steam
data:
  steam-setup.sh: |
    #!/bin/bash
    set -e
    
    echo "Setting up Steam environment..."
    
    # Remove container detection files
    sudo rm -f /run/systemd/container /run/host/container-manager || true
    
    # Fix permissions
    sudo chown root:root /usr/bin/bwrap 2>/dev/null || true
    sudo chown root:root /usr/bin/pkexec 2>/dev/null || true
    
    # Install Steam and dependencies if not already installed
    if ! dpkg -l | grep -q steam-installer; then
      echo "Installing Steam and dependencies..."
      sudo apt update -qq
      sudo sh -c 'DEBIAN_FRONTEND=noninteractive apt install -y \
        steam-installer \
        steam-devices \
        libgl1-mesa-dri:i386 \
        libgl1:amd64 \
        libgl1:i386 \
        libgbm1:amd64 \
        libgbm1:i386 \
        xdg-desktop-portal \
        xdg-desktop-portal-kde \
        lsof \
        pkexec \
        zenity'
    fi
    
    echo "Steam environment ready!"