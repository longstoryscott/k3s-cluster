--- # fnf
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: fnf-route
  namespace: nginx-gateway
spec:
  parentRefs:
    - name: lsm-gateway
      sectionName: fnf
  # hostnames:
  #   - press.longstorymedia.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/" # match all paths for this host
      backendRefs:
        - name: fnf
          port: 80
          namespace: fnf
          weight: 1
--- # Registry
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
