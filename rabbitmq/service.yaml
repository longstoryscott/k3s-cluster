apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: "rabbitmq"
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: management
      port: 15672
      targetPort: management
      nodePort: 32347
    - name: prometheus
      port: 15692
      targetPort: prometheus
  type: LoadBalancer
  publishNotReadyAddresses: true
