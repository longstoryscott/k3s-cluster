apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-gateway-timeouts
  namespace: nginx-gateway
data:
  custom-timeouts.conf: |
    # Increase proxy timeouts for WordPress
    proxy_connect_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_header_timeout 300s;
    client_body_timeout 300s;
    fastcgi_read_timeout 300s;
    fastcgi_send_timeout 300s;

    # Set keep-alive connection parameters
    keepalive_timeout 300s;
    keepalive_requests 1000;

    # Increase buffer sizes for larger requests/responses
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Disable request body size limits
    client_max_body_size 0;
