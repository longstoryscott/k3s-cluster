persistence:
  enabled: true
  size: 10Gi

serviceAccount:
  create: true
  name: loki

service:
  type: ClusterIP

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 512Mi

# Using monolithic mode for simpler installation
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: "filesystem"
  schemaConfig:
    configs:
      - from: 2020-10-24
        store: boltdb-shipper
        object_store: filesystem
        schema: v11
        index:
          prefix: index_
          period: 24h

monitoring:
  serviceMonitor:
    enabled: true
  selfMonitoring:
    enabled: false
