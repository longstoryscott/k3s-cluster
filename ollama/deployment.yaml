apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ollama
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/instance: ollama
    app.kubernetes.io/component: app
spec:
  selector:
    matchLabels:
      name: ollama
  template:
    metadata:
      labels:
        name: ollama
        app.kubernetes.io/name: ollama
        app.kubernetes.io/instance: ollama
        app.kubernetes.io/component: app
    spec:
      volumes:
        - name: ollama-models-volume
          persistentVolumeClaim:
            claimName: ollama-models
        - name: init-script
          configMap:
            name: ollama-init-script
            defaultMode: 0755
      initContainers:
        - name: create-modelfiles-dir
          image: busybox:latest
          command: ["sh", "-c", "mkdir -p /ollama/modelfiles"]
          volumeMounts:
            - name: ollama-models-volume
              mountPath: /ollama
          env:
            - name: DUMMY
              value: "true"
      containers:
        - name: ollama
          image: ollama/ollama:latest
          command: ["/bin/sh", "/scripts/init.sh"]
          ports:
            - name: http
              containerPort: 11434
              protocol: TCP
          resources:
            requests:
              memory: "4Gi"
              cpu: "4000m"
              nvidia.com/gpu: 1
            limits:
              memory: "8Gi"
              cpu: "8000m"
              nvidia.com/gpu: 1
          volumeMounts:
            - name: ollama-models-volume
              mountPath: /root/.ollama
            - name: init-script
              mountPath: /scripts
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0"
  strategy:
    type: Recreate
