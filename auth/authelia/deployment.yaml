apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia
  namespace: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authelia
  template:
    metadata:
      labels:
        app: authelia
    spec:
      containers:
        - name: authelia
          image: ghcr.io/authelia/authelia:latest
          args:
            - "--config"
            - "/config/configuration.yaml"
          ports:
            - containerPort: 9091
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          volumeMounts:
            - name: configmap-volume
              mountPath: /config
              readOnly: true
            - name: data-volume
              mountPath: /data
          env:
            - name: AUTHELIA_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: session_secret
            - name: AUTHELIA_STORAGE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: storage_encryption_key
            - name: AUTHELIA_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: jwt_secret
      volumes:
        - name: configmap-volume
          configMap:
            name: authelia-config
        - name: data-volume
          emptyDir: {} # or use a PVC for persistence
